<!doctype html><html lang="en"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Eliza Cup Season 26/27 Preview</title>
<link id="fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style id="css">
/* Layout: matches elizacup.com. Black bar with yellow active pill, black masthead, navy banner, cream page, white cards with a coloured left edge per division, yellow odds strip. Single light look, like the site. */
:root{
  --bg:#F6F2E8; --surface:#FFFFFF; --soft:#FAF8F2; --ink:#111111; --muted:#5E5A52; --line:#E3DDCF;
  --black:#000000; --yellow:#FFDD00; --navy:#28427C; --fa:#0A2F85;
  --d1:#28427C; --d1i:#FFFFFF; --d2a:#BC3532; --d2ai:#FFFFFF; --d2b:#990000; --d2bi:#FFFFFF;
  --d3a:#6AA84F; --d3ai:#10260A; --d3b:#274E13; --d3bi:#FFFFFF; --d3t:#111111; --d3ti:#FFFFFF;
  --slip:#FFDD00; --slip-ink:#111111; --slip-rule:rgba(17,17,17,.4); --slip-field:rgba(255,255,255,.7);
  --good:#1F7A4D; --warn:#B4461B;
  --display:'Barlow Condensed','Arial Narrow',Impact,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --label:'Barlow Condensed','Arial Narrow',sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
.bar :focus-visible{outline-color:var(--yellow)}

/* top bar, like the site nav */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--black);color:#fff}
.barin{max-width:1360px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.cb{display:inline-flex;gap:8px;align-items:baseline;font:600 16px var(--body);padding:8px 16px;border:0;background:transparent;color:#fff;border-radius:8px;cursor:pointer}
.cb b{font:600 14px var(--label);color:#BDB8A8}
.cb[aria-pressed="true"]{background:var(--yellow);color:#111}
.cb[aria-pressed="true"] b{color:#111;opacity:.7}
.search{flex:1 1 180px;max-width:280px;min-width:0}
.bar .search input{background:#1B1B1B;border:1px solid #4A4A4A;color:#fff}
.bar .search input::placeholder{color:#A8A39A}
.acts{margin-left:auto;display:flex;flex-wrap:wrap;gap:8px}
.btn{font:600 15px var(--body);padding:8px 16px;border-radius:8px;border:2px solid var(--ink);background:transparent;cursor:pointer}
.bar .btn{border-color:#fff;color:#fff}
.bar .btn.slip,.btn.slip{background:var(--yellow);border-color:var(--yellow);color:#111}
.btn.primary{background:var(--ink);color:#fff}
.btn:disabled{opacity:.5;cursor:default}

.wrap{max-width:1360px;margin:0 auto;padding-inline:16px;padding-block:24px 72px}

/* masthead */
.brand{background:var(--black);display:flex;justify-content:center;align-items:center;gap:clamp(12px,3vw,28px);padding:22px 16px}
.logo{height:clamp(64px,10vw,104px);width:auto;display:block}
h1{font:800 clamp(44px,9vw,88px)/1 var(--display);text-transform:uppercase;color:#fff;margin:0}
.season{background:var(--navy);color:#fff;text-align:center;font:700 clamp(24px,4vw,38px)/1.1 var(--display);text-transform:uppercase;padding:18px 16px;margin:12px 0 0}
.meta{font:500 16px/1.4 var(--body);color:var(--muted);text-align:center;margin:18px 0 0}

input,select,textarea{width:100%;background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0}
textarea{field-sizing:content;min-height:5.5em;resize:vertical;line-height:1.45}
select{padding-block:7px}
.notice{margin-top:16px;padding:10px 14px;border:1px solid var(--line);background:var(--surface);border-radius:6px;font-size:15px}
.notice.err{border-color:var(--warn)}
.notice .btn{margin-left:8px;padding:4px 10px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;margin-top:16px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.panel h4,.desk h3{font:700 13px/1 var(--label);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.lab3{display:grid;gap:10px}
.lab3 label{display:grid;gap:4px;font:600 13px var(--label);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.hint{margin:10px 0 0;font-size:14px;color:var(--muted)}
.big{font:800 44px/1 var(--display);margin:0}
.big.over{color:var(--warn)}

/* division sections: banner in the division colour */
.sec{padding-top:36px;--dc:var(--d3t);--dci:var(--d3ti)}
.sec.D1,.card.D1{--dc:var(--d1);--dci:var(--d1i)}
.sec.D2A,.card.D2A{--dc:var(--d2a);--dci:var(--d2ai)}
.sec.D2B,.card.D2B{--dc:var(--d2b);--dci:var(--d2bi)}
.sec.D3A,.card.D3A{--dc:var(--d3a);--dci:var(--d3ai)}
.sec.D3B,.card.D3B{--dc:var(--d3b);--dci:var(--d3bi)}
.sec.D3T,.card.D3T{--dc:var(--d3t);--dci:var(--d3ti)}
.dh{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 16px;margin-bottom:16px;padding:14px 20px;background:var(--dc);color:var(--dci)}
.dh h2{font:800 clamp(30px,5vw,44px)/1 var(--display);text-transform:uppercase;margin:0}
.dh p{font:600 17px var(--display);text-transform:uppercase;letter-spacing:.06em;margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:16px}
.none{color:var(--muted);margin:0;font-size:15px}

/* draw desk */
.desk{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--black);border-radius:6px;padding:16px;margin-bottom:16px}
.deskhead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px;align-items:baseline;margin-bottom:6px}
.deskhead h3{margin:0}
.deskhead p{margin:0;font:600 15px var(--label);letter-spacing:.04em;color:var(--muted)}
.drow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;padding:8px 0;border-top:1px solid var(--line)}
.dn{display:flex;flex-direction:column;min-width:0;flex:1 1 200px}
.dn strong{font:700 22px/1.1 var(--display);text-transform:uppercase;overflow-wrap:anywhere}
.dn span{font:600 13px var(--label);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dbtns{display:flex;gap:8px}
.dbtns .btn{min-width:60px}
.dbtns .btn[data-to="D3A"]{background:var(--d3a);border-color:var(--d3a);color:var(--d3ai)}
.dbtns .btn[data-to="D3B"]{background:var(--d3b);border-color:var(--d3b);color:var(--d3bi)}

/* team card */
.card{display:flex;flex-direction:column;min-width:0;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--dc);border-radius:6px;overflow:hidden;--dc:var(--d3t);--dci:var(--d3ti)}
.ch{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;padding:16px}
.tile{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;line-height:1;background:var(--soft);border:1px solid var(--line);text-align:center;white-space:nowrap;overflow:hidden}
.tile .eimg{width:34px;height:34px;display:block}
.lg{width:56px;height:64px;display:flex;align-items:center;justify-content:center}
.lg img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.ch.notile{grid-template-columns:minmax(0,1fr) auto}
.soon{font:italic 500 16px/1.45 var(--body);color:var(--muted);margin:0}
html.embed .bar{position:static}
html.embed .brand,html.embed .season{display:none}
html.embed .wrap{padding-block:0 24px}
.tile.two{font-size:21px}
.tile.many{font-size:14px}
.tile.ph{border:1.5px dashed var(--muted);font-size:26px;filter:grayscale(1);opacity:.4}
input.tile{width:56px;padding:0;border:1.5px dashed var(--muted);border-radius:50%;background:var(--soft);font-size:28px}
input.tile::placeholder{font-size:26px;opacity:.4}
.ch h3{font:700 28px/1 var(--display);text-transform:uppercase;margin:0 0 5px;overflow-wrap:anywhere}
.pl{font:600 14px var(--label);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0;overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font:700 13px/1 var(--display);letter-spacing:.05em;text-transform:uppercase;padding:5px 10px;border:1px solid var(--line);color:var(--muted);border-radius:999px}
.tag.dv{background:var(--dc);border-color:var(--dc);color:var(--dci)}
.tag.charity{background:var(--yellow);border-color:var(--yellow);color:#111}
.tag.up{color:var(--good);border-color:var(--good)}
.tag.down{color:var(--warn);border-color:var(--warn)}
.tag.new{color:var(--ink);border-color:var(--ink)}
.tc{text-align:right}
.tc b{display:block;font:800 52px/.9 var(--display);font-variant-numeric:tabular-nums}
.tc span{font:600 12px var(--label);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tc.zero b{color:var(--muted)}
.tc em{display:block;font:600 13px var(--label);letter-spacing:.06em;text-transform:uppercase;font-style:normal;color:var(--muted);margin-top:3px}
.cab{margin-bottom:10px}
.cab:last-of-type{margin-bottom:0}
.cl{font:700 12px/1 var(--label);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.chip.maj{background:var(--yellow);border-color:var(--yellow);color:#111}
.cd{padding:14px 16px;border-top:1px solid var(--line)}
.cd h4{font:700 13px/1 var(--label);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;display:flex;justify-content:space-between;gap:8px}
.finish{display:flex;align-items:baseline;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.finish strong{font:700 26px/1 var(--display);text-transform:uppercase}
.finish span{font:700 20px var(--display)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px 12px;margin:0 0 10px}
.stats:last-child{margin-bottom:0}
.stats dt{font:600 12px/1.2 var(--label);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stats dd{margin:2px 0 0;font:700 19px/1.2 var(--display);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.chips2{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 14px var(--display);letter-spacing:.03em;padding:3px 10px;border:1px solid var(--line);border-radius:999px;background:var(--soft)}
.chip b{font-weight:800}
.chip.alt{border-style:dashed}
.yrs{margin-top:10px;font-size:14px;color:var(--muted)}
.yrs summary{cursor:pointer;font:600 13px var(--label);letter-spacing:.08em;text-transform:uppercase}
.yrs ul{margin:6px 0 0;padding-left:18px}
.note,.aka{font:400 14px/1.4 var(--body);color:var(--muted);margin:10px 0 0;overflow-wrap:anywhere}
.wf{margin-bottom:12px}
.wf:last-child{margin-bottom:0}
.wf h5{font:700 13px/1 var(--label);letter-spacing:.1em;text-transform:uppercase;margin:0 0 4px}
.wf label{display:block;font:700 13px/1 var(--label);letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px}
.prose{white-space:pre-line;margin:0;max-width:65ch}
.editbar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:12px 16px;border-top:1px dashed var(--line);background:var(--soft)}
.editbar label{display:flex;gap:8px;align-items:center;font:600 14px var(--label);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.editbar select{width:auto;min-width:160px}
.editbar input[type="checkbox"]{width:auto}

/* odds strip */
.slip{margin-top:auto;background:var(--slip);color:var(--slip-ink);padding:10px 0 12px}
.slipcap{font:700 12px/1 var(--label);letter-spacing:.14em;text-transform:uppercase;margin:0 16px 8px}
.odds{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.oc{display:flex;flex-direction:column;gap:4px;padding:2px 10px;min-width:0;border-left:2px dashed var(--slip-rule)}
.oc:first-child{border-left:0;padding-left:16px}
.ol{font:700 12px/1.1 var(--label);letter-spacing:.06em;text-transform:uppercase;overflow-wrap:anywhere}
.ov{font:700 24px/1.1 var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.ov.long{font-size:20px}
@media (max-width:460px){.ov{font-size:22px}.ov.long{font-size:18px}.oc{padding:2px 7px}.oc:first-child{padding-left:14px}}
.oc.off{opacity:.5}
.oin{background:var(--slip-field);color:var(--slip-ink);border:1px solid var(--slip-rule);border-radius:4px;padding:5px 6px;font:700 18px var(--display)}
.oc label{font:700 12px/1.1 var(--label);letter-spacing:.06em;text-transform:uppercase}
@media (max-width:460px){
  .ch{grid-template-columns:auto minmax(0,1fr)}
  .ch.notile{grid-template-columns:minmax(0,1fr)}
  .tc{grid-column:1 / -1;display:flex;align-items:baseline;gap:10px;text-align:left}
  .tc b{font-size:38px}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

var $=function(s){return document.querySelector(s)};
var S=JSON.parse(document.getElementById('state').textContent);
var S0=JSON.stringify(S);
var editing=false,dirty=false,filter='all',q='',draftTimer=0;
var artifactNS=null,dlNS=null,canEdit=false;
var STANDALONE=S.standaloneEdit===true&&!(window.claude&&typeof window.claude.use==='function');

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function fmt(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,',')}
function dinfo(k){for(var i=0;i<DIVS.length;i++){if(DIVS[i].k===k)return DIVS[i]}return DIVS[3]}
function gcount(s){s=String(s||'');if(!s)return 0;try{if(window.Intl&&Intl.Segmenter){var n=0,it=new Intl.Segmenter(undefined,{granularity:'grapheme'}).segment(s)[Symbol.iterator](),r;while(!(r=it.next()).done)n++;return n}}catch(e){}return Array.from(s).length}
function tcls(s){var n=gcount(s);return n>2?' many':(n===2?' two':'')}
function initials(n){var w=String(n).replace(/[^A-Za-z0-9 ]/g,'').split(/\s+/).filter(Boolean).slice(0,2);return w.map(function(x){return x[0]}).join('').toUpperCase()||'?'}
function byId(id){for(var i=0;i<S.teams.length;i++){if(S.teams[i].id===id)return S.teams[i]}return null}
function byRank(a,b){var ra=(a.last&&a.last.roddyRank)||9999,rb=(b.last&&b.last.roddyRank)||9999;if(ra!==rb)return ra-rb;return a.name<b.name?-1:(a.name>b.name?1:0)}
function matches(t){if(!q)return true;return (t.name+' '+t.player+' '+(t.aka||'')).toLowerCase().indexOf(q)>-1}
function count(k){return S.teams.filter(function(t){return t.div===k}).length}
function move(t){if(!t.last||!t.last.level)return '';var c=dinfo(t.div).lvl;return c<t.last.level?'up':(c>t.last.level?'down':'')}

function oddsCell(t,key,label,off){
  var v=(t.odds&&t.odds[key])||'';
  if(editing){
    var id='o-'+key+'-'+t.id;
    return '<div class="oc"><label for="'+id+'">'+esc(label)+'</label><input id="'+id+'" class="oin" data-id="'+t.id+'" data-f="odds.'+key+'" value="'+esc(v)+'" autocomplete="off"'+(off?' disabled placeholder="n/a"':' placeholder="—"')+'></div>';
  }
  return '<div class="oc'+(off?' off':'')+'"><span class="ol">'+esc(label)+'</span><span class="ov'+(v.length>6?' long':'')+'">'+(v?esc(v):(off?'n/a':'—'))+'</span></div>';
}
function wfield(t,key,label,rows,main){
  var v=t[key]||'';
  if(editing){
    var id=key+'-'+t.id;
    return '<div class="wf">'+(main?'':'<label for="'+id+'">'+esc(label)+'</label>')+'<textarea id="'+id+'" rows="'+rows+'" data-id="'+t.id+'" data-f="'+key+'"'+(main?' aria-label="'+esc(label)+' for '+esc(t.name)+'"':'')+'>'+esc(v)+'</textarea></div>';
  }
  if(v)return '<div class="wf">'+(main?'':'<h5>'+esc(label)+'</h5>')+'<p class="prose">'+esc(v)+'</p></div>';
  return main?'<p class="none">Write-up to come.</p>':'';
}

  var lastSec='<div class="cd"><h4><span>Last season</span><span>'+esc(S.lastLabel)+'</span></h4>'+last+'</div>';

  var mk=function(i){return '<span class="chip'+(MAJOR[i.k]?' maj':'')+'">'+esc(i.k)+' <b>×'+i.n+'</b></span>'};
  var majI=tro.items.filter(function(i){return MAJOR[i.k]}),minI=tro.items.filter(function(i){return !MAJOR[i.k]});
  var yrs=tro.items.filter(function(i){return i.y}).map(function(i){return '<li>'+esc(i.k)+': '+esc(i.y)+'</li>'});
  var lb='';
  if(tro.leigh&&tro.leigh.n){lb='<div class="cab"><p class="cl">#1 overall on the platform</p><div class="chips2"><span class="chip alt">Leigh Broxham <b>×'+tro.leigh.n+'</b></span></div></div>';if(tro.leigh.y)yrs.push('<li>Leigh Broxham: '+esc(tro.leigh.y)+'</li>')}
  var cab='';
  if(majI.length)cab+='<div class="cab"><p class="cl">Major titles</p><div class="chips2">'+majI.map(mk).join('')+'</div></div>';
  if(minI.length)cab+='<div class="cab"><p class="cl">Minor titles</p><div class="chips2">'+minI.map(mk).join('')+'</div></div>';
  cab+=lb;
  if(cab&&yrs.length)cab+='<details class="yrs"><summary>Years won</summary><ul>'+yrs.join('')+'</ul></details>';
  if(!cab)cab='<p class="none">Cabinet empty.</p>';
  if(tro.notes)cab+='<p class="note">'+esc(tro.notes)+'</p>';
  var cabSec='<div class="cd"><h4><span>Trophy cabinet</span><span>'+maj+' major · '+mino+' minor</span></h4>'+cab+'</div>';

  var lab=S.labels;
  var write=wfield(t,'preview',t.heading||lab.preview||'Season Preview',5,true)+(lab.x1?wfield(t,'x1',lab.x1,2,false):'')+(lab.x2?wfield(t,'x2',lab.x2,2,false):'')+(lab.x3?wfield(t,'x3',lab.x3,2,false):'');
  if(editing){
    write+='<div class="wf"><label for="predict-'+t.id+'">Super Computer</label><input id="predict-'+t.id+'" data-id="'+t.id+'" data-f="predict" value="'+esc(t.predict)+'" placeholder="e.g. Top 3, Finals, Mid-Table" autocomplete="off"></div>';
  }else if(t.predict){
    write+='<p class="note">Super Computer: '+esc(t.predict)+'</p>';
  }
  if(t.aka)write+='<p class="aka">Previously: '+esc(t.aka)+'</p>';
  var soon=(!editing&&!(t.preview&&t.preview.trim())&&lab.soon)?'<p class="soon">'+esc(lab.soon)+'</p>':null;
  var writeSec='<div class="cd"><h4><span>'+esc(t.heading||lab.preview||'Season Preview')+'</span></h4>'+(soon||write)+'</div>';

  var eb='';
  if(editing){
    eb='<div class="editbar"><label>Division <select data-id="'+t.id+'" data-f="div">'+DIVS.map(function(x){return '<option value="'+x.k+'"'+(x.k===t.div?' selected':'')+'>'+x.title+' · '+x.sub+'</option>'}).join('')+'</select></label>'+
       '<label><input type="checkbox" data-id="'+t.id+'" data-f="ecl"'+(t.ecl?' checked':'')+'> In the ECL</label>'+
       '<label><input type="checkbox" data-id="'+t.id+'" data-f="charity"'+(t.charity?' checked':'')+'> Charity promotion</label></div>';
  }
  var slip='<div class="slip" role="group" aria-label="Odds to win for '+name+'"><p class="slipcap">Odds to win</p><div class="odds">'+
    oddsCell(t,'div',d.odds,false)+oddsCell(t,'roddy','Roddy',false)+oddsCell(t,'ecl','ECL',!t.ecl)+oddsCell(t,'fa','FA Cup',false)+'</div></div>';
  return '<article class="card '+t.div+'" id="t-'+t.id+'">'+head+lastSec+cabSec+writeSec+eb+slip+'</article>';
}

function deskHTML(){
  var pool=S.teams.filter(function(t){return t.div==='D3T'}).sort(byRank);
  var h='<div class="desk"><div class="deskhead"><h3>Draw desk</h3><p>'+pool.length+' to draw · 3A has '+count('D3A')+' · 3B has '+count('D3B')+'</p></div>';
  if(!pool.length)h+='<p class="none">Every Division 3 team has a conference.</p>';
  pool.forEach(function(t){
    h+='<div class="drow"><div class="dn"><strong>'+esc(t.name)+'</strong><span>'+esc(t.player||'Player TBC')+'</span></div><div class="dbtns">'+
      '<button type="button" class="btn" data-act="assign" data-id="'+t.id+'" data-to="D3A" aria-label="Put '+esc(t.name)+' in Division 3 Conference A">3A</button>'+
      '<button type="button" class="btn" data-act="assign" data-id="'+t.id+'" data-to="D3B" aria-label="Put '+esc(t.name)+' in Division 3 Conference B">3B</button></div></div>';
  });
  return h+'</div>';
}

function inFilter(d){return filter==='all'||filter===d.grp}
function render(){
  renderBar();renderPanel();
  var html='';
  DIVS.forEach(function(d){
    if(!inFilter(d))return;
    var total=count(d.k);
    var ts=S.teams.filter(function(t){return t.div===d.k&&matches(t)}).sort(byRank);
    var isPool=d.k==='D3T';
    if(isPool&&!editing&&!total)return;
    if(!ts.length&&!(isPool&&editing))return;
    html+='<section class="sec '+d.k+'"><header class="dh"><h2>'+d.title+'</h2><p>'+d.sub+' · '+total+' team'+(total===1?'':'s')+'</p></header>'+
      (isPool&&editing?deskHTML():'')+(ts.length?'<div class="grid">'+ts.map(cardHTML).join('')+'</div>':'')+'</section>';
  });
  $('#secs').innerHTML=html||'<p class="none" style="padding-top:32px">No teams match that search.</p>';
}
function buildChips(){
  $('#chips').innerHTML=GROUPS.map(function(g){return '<button type="button" class="cb" data-act="filter" data-v="'+g.v+'" aria-pressed="false">'+g.label+' <b></b></button>'}).join('');
}
function renderBar(){
  var nodes=document.querySelectorAll('.cb');
  for(var i=0;i<nodes.length;i++){
    var v=nodes[i].getAttribute('data-v');
    nodes[i].setAttribute('aria-pressed',String(v===filter));
    var n=S.teams.filter(function(t){return v==='all'||dinfo(t.div).grp===v}).length;
    nodes[i].querySelector('b').textContent=n;
  }
  $('#b-edit').hidden=!canEdit;
  $('#b-save').textContent=STANDALONE?'Save a copy':'Save and publish';
  $('#b-edit').textContent=editing?'Done editing':'Edit page';
  $('#b-save').hidden=!(canEdit&&dirty);
  $('#b-discard').hidden=!(canEdit&&dirty);
  $('#b-dl').hidden=!(canEdit&&dlNS);
  var g={D1:0,D2:0,D3:0};S.teams.forEach(function(t){g[dinfo(t.div).grp]++});
  $('#meta').textContent=S.teams.length+' teams · Division 1: '+g.D1+' · Division 2: '+g.D2+' · Division 3: '+g.D3+'';
}
function labelInput(key,text){return '<label>'+text+'<input data-g="'+key+'" value="'+esc(S.labels[key]||'')+'" autocomplete="off"></label>'}
function renderPanel(){
  var el=$('#panel');
  if(!editing){el.hidden=true;return}
  el.hidden=false;
  var n=S.teams.filter(function(t){return t.ecl}).length;
  var wasFocus=document.activeElement&&el.contains(document.activeElement);
  if(wasFocus)return;
  el.innerHTML='<div class="pgrid"><div><h4>Write-up headings</h4><div class="lab3">'+labelInput('preview','Main write-up')+labelInput('x1','Extra section 1')+labelInput('x2','Extra section 2')+labelInput('x3','Extra section 3')+labelInput('soon','Text shown when a team has no write-up yet')+'</div><p class="hint">Clear an extra heading to hide that section on every card.</p></div>'+
    '<div><h4>ECL field</h4><p class="big" id="eclcount">'+n+' / 12</p><p class="hint">Tick "In the ECL" on a team card. Only those teams get ECL odds.</p></div>'+
    '<div><h4>Draw</h4><p class="hint">The draw desk sits at the top of Division 3. Tap 3A or 3B and the team moves into that conference. You can also change any team from the Division menu at the bottom of its card.</p></div></div>';
}
function updEcl(){var n=S.teams.filter(function(t){return t.ecl}).length,e=$('#eclcount');if(e){e.textContent=n+' / 12';e.className='big'+(n>12?' over':'')}}

/* state, drafts, saving */
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}
function sig(x){var c=JSON.parse(JSON.stringify(x));delete c.rev;return JSON.stringify(c)}
function markDirty(){
  dirty=sig(S)!==sig(JSON.parse(S0));
  $('#b-save').hidden=!(canEdit&&dirty);$('#b-discard').hidden=!(canEdit&&dirty);
  clearTimeout(draftTimer);
  draftTimer=setTimeout(function(){if(dirty)lsSet(DRAFT,JSON.stringify({base:S.rev,state:S}));else lsDel(DRAFT)},600);
}
function notice(msg,err,extra){
  var n=$('#notice');
  if(!msg){n.hidden=true;n.textContent='';return}
  n.hidden=false;n.className='notice'+(err?' err':'');n.textContent=msg;
  if(extra){extra.forEach(function(b){var x=document.createElement('button');x.type='button';x.className='btn';x.textContent=b[0];x.setAttribute('data-act',b[1]);n.appendChild(x)})}
}
function skeletonCss(){
  try{
    var st=document.head.querySelectorAll('style');
    for(var i=0;i<st.length;i++){var c=st[i].textContent;if(c.indexOf('safe-area-inset')>-1&&c.indexOf('hidden')>-1)return c}
  }catch(e){}
  return ':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}';
}
function buildDoc(st){
  var css=document.getElementById('css').textContent;
  var code=document.getElementById('code').textContent;
  var fonts=document.getElementById('fonts').outerHTML;
  var json=JSON.stringify(st).replace(/</g,'\\u003c');
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+skeletonCss()+'</style></head><body>'+
    '<title>'+TITLE+'</title>'+fonts+'<style id="css">'+css+'</style><div id="app"></div>'+
    '<script type="application/json" id="state">'+json+'<'+'/script><script id="code">'+code+'<'+'/script></body></html>';
}
function saveFile(){
  if(!dirty)return;
  var next=JSON.parse(JSON.stringify(S));next.rev=(S.rev||0)+1;
  try{
    var blob=new Blob([buildDoc(next)],{type:'text/html'});
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='eliza-cup-26-27-preview.html';
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(a.href)},4000);
    S=next;S0=JSON.stringify(S);dirty=false;lsDel(DRAFT);
    notice('Saved. A new copy of the page was downloaded. Use it in place of your old file.');renderBar();
  }catch(e){notice('The copy could not be saved. Your edits are still on the page.',true)}
}
function save(){
  if(STANDALONE){saveFile();return}
  if(!artifactNS||!dirty)return;
  var next=JSON.parse(JSON.stringify(S));next.rev=(S.rev||0)+1;
  lsSet(DRAFT,JSON.stringify({base:S.rev,state:S}));
  notice('Saving…');
  artifactNS.publish(buildDoc(next)).then(function(){
    notice('Saved. The page is reloading with your changes.');
  }).catch(function(e){
    var c=e&&e.code;
    if(c==='conflict')notice('Someone else saved first, so the page is reloading to their version. Your edits are kept as a draft in this browser.',true);
    else if(c==='not_writer'||c==='not_granted'||c==='consent_required'||c==='capability_disabled'){canEdit=false;editing=false;notice('This view is read-only, so nothing was saved.',true);render()}
    else if(c==='rate_limited')notice('Saving too often. Wait a moment, then save again.',true);
    else if(c==='too_large')notice('The page is too large to save.',true);
    else notice('Saving failed. Your edits are still on the page. Try again in a moment.',true);
  });
}
function download(){
  if(!dlNS)return;
  dlNS.save({filename:'eliza-cup-26-27-preview.html',data:buildDoc(S)}).then(function(){notice('Page file saved.')}).catch(function(e){if(!e||e.code!=='declined')notice('The page file could not be saved here.',true)});
}

/* events */
document.addEventListener('input',function(e){
  var el=e.target,f=el.getAttribute&&el.getAttribute('data-f'),id=el.getAttribute&&el.getAttribute('data-id'),g=el.getAttribute&&el.getAttribute('data-g');
  if(f&&id){
    var t=byId(id);if(!t)return;
    if(f.indexOf('odds.')===0){t.odds=t.odds||{};t.odds[f.slice(5)]=el.value}else if(f!=='div'&&f!=='ecl'&&f!=='charity'){t[f]=el.value}
    if(f==='emoji')el.className='tile'+tcls(el.value);
    markDirty();return;
  }
  if(g){S.labels[g]=el.value;markDirty();return}
  if(el.id==='q'){q=el.value.trim().toLowerCase();render()}
});
document.addEventListener('change',function(e){
  var el=e.target,f=el.getAttribute&&el.getAttribute('data-f'),id=el.getAttribute&&el.getAttribute('data-id');
  if(!f||!id)return;
  var t=byId(id);if(!t)return;
  if(f==='div'){t.div=el.value;markDirty();render()}
  else if(f==='ecl'){t.ecl=el.checked;markDirty();render()}
  else if(f==='charity'){t.charity=el.checked;markDirty();render()}
});
document.addEventListener('click',function(e){
  var b=e.target.closest&&e.target.closest('[data-act]');if(!b)return;
  var a=b.getAttribute('data-act');
  if(a==='filter'){filter=b.getAttribute('data-v');render()}
  else if(a==='edit'){editing=!editing;render()}
  else if(a==='assign'){var t=byId(b.getAttribute('data-id'));if(t){t.div=b.getAttribute('data-to');markDirty();render()}}
  else if(a==='save')save();
  else if(a==='discard'){S=JSON.parse(S0);dirty=false;lsDel(DRAFT);notice('');render()}
  else if(a==='download')download();
  else if(a==='restore'){var d=null;try{d=JSON.parse(lsGet(DRAFT))}catch(x){}if(d&&d.state){var r=S.rev;S=d.state;S.rev=r;editing=true;notice('Draft restored. Save to keep it.');markDirty();render()}}
  else if(a==='dropdraft'){lsDel(DRAFT);notice('')}
});

/* embed mode: add ?embed=1 to the page address when it is placed in an iframe */
var EMBED=/[?&]embed=/.test(location.search);
if(EMBED)document.documentElement.className+=' embed';
function postH(){try{if(EMBED&&window.parent&&window.parent!==window)window.parent.postMessage({type:'eliza-preview-height',height:Math.ceil(document.documentElement.scrollHeight)},'*')}catch(e){}}
if(EMBED){try{if(window.ResizeObserver)new ResizeObserver(postH).observe(document.body)}catch(e){}window.addEventListener('load',postH);window.addEventListener('resize',postH)}

/* start */
$('#app').innerHTML=SHELL;
buildChips();
render();
var c=window.claude;
if(STANDALONE){
  canEdit=true;
  var raw0=lsGet(DRAFT),d0=null;
  try{d0=raw0?JSON.parse(raw0):null}catch(x){}
  if(d0&&d0.state){
    if(sig(d0.state)===sig(S))lsDel(DRAFT);
    else notice('You have unsaved edits from an earlier visit in this browser.',false,[['Restore them','restore'],['Discard them','dropdraft']]);
  }
  renderBar();
}else if(c&&typeof c.use==='function'){
  var safe=function(n){try{return Promise.resolve(c.use(n)).catch(function(){return null})}catch(e){return Promise.resolve(null)}};
  Promise.all([safe('artifact'),safe('user'),safe('downloads')]).then(function(r){
    artifactNS=r[0];dlNS=r[2];
    var u=r[1];
    return (u&&typeof u.canEdit==='function'?Promise.resolve(u.canEdit()).catch(function(){return false}):Promise.resolve(false)).then(function(ok){
      canEdit=!!artifactNS&&ok===true;
      if(canEdit){
        var raw=lsGet(DRAFT),d=null;
        try{d=raw?JSON.parse(raw):null}catch(x){}
        if(d&&d.state){
          if(sig(d.state)===sig(S))lsDel(DRAFT);
          else notice('You have unsaved edits from an earlier visit in this browser.',false,[['Restore them','restore'],['Discard them','dropdraft']]);
        }
      }
      renderBar();
    });
  });
}
})();
</script>
